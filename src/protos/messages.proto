syntax = "proto3";

package bz;

// If you generate C++ and want a namespace, uncomment:
// option csharp_namespace = "BZ";
// option java_package = "com.example.bz";

// ----- Common types -----

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Quat {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message PlayerState {
  Vec3 position = 1;
  Vec3 rotation = 2;   // Keeping as vec3 since your struct uses glm::vec3
  bool alive = 3;
  float speed = 4;
  float jumpSpeed = 5;
  float shotSpeed = 6;
}

// If these are typedefs in your code, choose an actual wire type.
// uint32 is typical for ids, uint64 if you might exceed 2^32-1.
typedef uint32 client_id = 0; // (not valid protobuf; see note below)
typedef uint32 shot_id   = 0; // (not valid protobuf; see note below)

// Protobuf doesn't support typedefs; so we just use uint32 fields for ids.

// ----- Server messages -----

message ServerMsg_PlayerLocation {
  uint32 clientId = 1;
  Vec3 position = 2;
  Quat rotation = 3;
  Vec3 velocity = 4;
}

message ServerMsg_PlayerJoin {
  uint32 clientId = 1;
  string name = 2;
  PlayerState state = 3;
}

message ServerMsg_PlayerState {
  uint32 clientId = 1;
  PlayerState state = 2;
}

message ServerMsg_DefaultPlayerStateChange {
  uint32 clientId = 1;
  string key = 2;
  float value = 3;
}

message ServerMsg_PlayerLeave {
  uint32 clientId = 1;
}

message ServerMsg_PlayerSpawn {
  uint32 clientId = 1;
  Vec3 position = 2;
  Quat rotation = 3;
  Vec3 velocity = 4;
}

message ServerMsg_PlayerDeath {
  uint32 clientId = 1;
}

message ServerMsg_CreateShot {
  uint32 globalShotId = 1;
  Vec3 position = 2;
  Vec3 velocity = 3;
}

message ServerMsg_RemoveShot {
  uint32 shotId = 1;
  bool isGlobalId = 2;
}

message ServerMsg_Chat {
  uint32 fromId = 1;
  uint32 toId = 2;
  string text = 3;
}

message ServerMsg_Init {
  uint32 clientId = 1;
  string serverName = 2;
  bytes worldData = 3; // replaces std::byte* worldData
}

// Envelope
message ServerMsg {
  oneof payload {
    ServerMsg_PlayerLocation player_location = 1;
    ServerMsg_PlayerLeave player_leave = 2;
    ServerMsg_PlayerJoin player_join = 3;
    ServerMsg_PlayerState player_state = 4;
    ServerMsg_DefaultPlayerStateChange default_player_state_change = 5;
    ServerMsg_PlayerSpawn player_spawn = 6;
    ServerMsg_PlayerDeath player_death = 7;
    ServerMsg_CreateShot create_shot = 8;
    ServerMsg_RemoveShot remove_shot = 9;
    ServerMsg_Init init = 10;
    ServerMsg_Chat chat = 11;
  }
}

// ----- Client messages -----

message ClientMsg_Join {
  uint32 clientId = 1;
  string ip = 2;
}

message ClientMsg_Leave {
  uint32 clientId = 1;
}

message ClientMsg_Init {
  uint32 clientId = 1;
  string name = 2;
}

message ClientMsg_RequestSpawn {
  uint32 clientId = 1;
}

message ClientMsg_Location {
  uint32 clientId = 1;
  Vec3 position = 2;
  Quat rotation = 3;
}

message ClientMsg_CreateShot {
  uint32 clientId = 1;
  uint32 localShotId = 2;
  Vec3 position = 3;
  Vec3 velocity = 4;
}

message ClientMsg_Chat {
  uint32 clientId = 1;
  uint32 toId = 2;
  string text = 3;
}

// Envelope
message ClientMsg {
  oneof payload {
    ClientMsg_Join join = 1;
    ClientMsg_Leave leave = 2;
    ClientMsg_Init init = 3;
    ClientMsg_RequestSpawn request_spawn = 4;
    ClientMsg_Location location = 5;
    ClientMsg_CreateShot create_shot = 6;
    ClientMsg_Chat chat = 7;
  }
}