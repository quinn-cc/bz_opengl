syntax = "proto3";
package bz;

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Location {
  // Adjust fields to match your C++ Location type:
  // e.g. Vec3 pos, float yaw, float pitch, etc.
  Vec3 position = 1;
  Vec3 forward  = 2; // or yaw/pitch/roll, whatever you use
}

// Good for your SettingsMap "key -> value" style.
// If you have mixed types, use oneof or google.protobuf.Value.
message SettingsMap {
  map<string, float> floats = 1;
  // optionally:
  // map<string, int32> ints = 2;
  // map<string, string> strings = 3;
}

//
// ----------- Server messages -----------
//

message Server_Location {
  uint32 client_id = 1;
  Location location = 2;
}

message Server_Connection {
  uint32 client_id = 1;
  string name = 2;          // replaces char[256]
  Location location = 3;
  bool alive = 4;
}

message Server_Disconnection {
  uint32 client_id = 1;
}

message Server_CreateShot {
  uint32 global_shot_id = 1;
  Vec3 position = 2;
  Vec3 velocity = 3;
}

message Server_RemoveShot {
  uint32 shot_id = 1;
  bool is_global_id = 2;
}

message Server_AllowSpawn {
  bool allow = 1;
  Location location = 2;
}

message Server_Spawn {
  uint32 client_id = 1;
  Location location = 2;
}

message Server_Death {
  uint32 client_id = 1;
}

message Server_Chat {
  uint32 from_id = 1;
  uint32 to_id = 2;
  string text = 3;          // replaces char[512]
}

message Server_WorldSettingChange {
  string key = 1;
  float value = 2;
}

message Server_Init {
  uint32 client_id = 1;
  string server_name = 2;
  SettingsMap settings = 3;

  // replaces (dataSize + data[1]) flexible array:
  bytes data = 4;
}

message ServerPacket {
  oneof payload {
    Server_Location location = 1;
    Server_Disconnection disconnection = 2;
    Server_Connection connection = 3;
    Server_CreateShot create_shot = 4;
    Server_RemoveShot remove_shot = 5;
    Server_AllowSpawn allow_spawn = 6;
    Server_Spawn spawn = 7;
    Server_Death death = 8;
    Server_Chat chat = 9;
    Server_WorldSettingChange world_setting_change = 10;
    Server_Init init = 11;
  }
}

//
// ----------- Client messages -----------
//

message Client_Connection {
  uint32 client_id = 1;  // you had this in ClientMsg base struct
  string ip = 2;
}

message Client_Disconnection {
  uint32 client_id = 1;
}

message Client_Init {
  uint32 client_id = 1;
  string name = 2;
}

message Client_RequestSpawn {
  uint32 client_id = 1;
}

message Client_Location {
  uint32 client_id = 1;
  Location location = 2;
}

message Client_CreateShot {
  uint32 client_id = 1;
  uint32 local_shot_id = 2;
  Vec3 position = 3;
  Vec3 velocity = 4;
}

message Client_Chat {
  uint32 client_id = 1;
  uint32 to_id = 2;
  string text = 3;
}

message ClientPacket {
  oneof payload {
    // If you truly have "REQUEST_CONNECTION" distinct from "CONNECTION",
    // make a separate message for it here.
    Client_Connection connection = 1;
    Client_Disconnection disconnection = 2;
    Client_Init init = 3;
    Client_RequestSpawn request_spawn = 4;
    Client_Location location = 5;
    Client_CreateShot create_shot = 6;
    Client_Chat chat = 7;
  }
}